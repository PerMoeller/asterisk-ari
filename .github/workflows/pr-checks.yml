name: PR checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - run: npm run build

  version-bump:
    name: version-bump
    runs-on: ubuntu-latest
    steps:
      # Full history so the base branch tip can be read for comparison.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: node --test .github/scripts/require-version-bump.test.mjs

      - run: node .github/scripts/require-version-bump.mjs
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
